<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">TCS publishing architecture</title><desc id="desc">Cron launches the importer, which reads private settings and Facebook posts, merges the source cache, and runs the page builder. The generated site is deployed to static hosting for readers.</desc>
