<text x="35" y="555" font-family="Arial,sans-serif" font-size="13" fill="#475569">Sync machine retains credentials and source cache.</text>
<text x="35" y="578" font-family="Arial,sans-serif" font-size="13" fill="#475569">Deploy the generated site/ directory to public hosting.</text>
